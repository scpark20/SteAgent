[project]
name = "steagent"
version = "0.1.0"
description = "A minimal LangGraph agent using a local Ollama model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1,<2",
]

[project.optional-dependencies]
llm = [
    "accelerate>=1,<2",
    "torch>=2.8,<3",
    "transformers>=4.57,<6",
]
